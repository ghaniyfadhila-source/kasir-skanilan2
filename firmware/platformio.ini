; PlatformIO Project Configuration
; Kasir Skanilan 2 — firmware kasir ESP8266
;
; Build:
;   pio run                     # build semua environment
;   pio run -e nodemcuv2        # build untuk NodeMCU v3
;   pio run -e nodemcuv2 -t upload
;   pio device monitor
;
; Upload partition tables (pilih salah satu, jangan dua-duanya):
;   pio run -e nodemcuv2_ota -t uploadfs      # partisi LittleFS
;   # atau set partitions_csv di environment dan build ulang

[platformio]
default_envs = nodemcuv2_ota
description = Firmware kasir RFID untuk kantin sekolah
src_dir = src

[common]
platform = espressif8266@4.2.1
framework = arduino
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, time
; ESP8266WiFi, ESP8266HTTPClient, dan LittleFS sudah ikut paket platform
; espressif8266, jadi tidak perlucribe sebagai lib_deps.
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    miguelbalboa/MFRC522 @ ^1.4.12
build_flags =
    -D NDEBUG
    -D FIRMWARE_VERSION=\"1.0.0\"
    -D CORE_DEBUG_LEVEL=0

; ---------------------------------------------------------------- NodeMCU v3
; Partisi: 1 app (1MB) + 2 app OTA (1MB) + 1MB LittleFS
[env:nodemcuv2_ota]
extends = common
board = nodemcuv2
board_build.filesystem = littlefs
board_build.partitions = partitions_ota.csv

; ---------------------------------------------------------------- NodeMCU v3
; Partisi: 1 app (3MB) + 1MB LittleFS, tanpa OTA.
; Pakai ini kalau firmware terlalu besar untuk app 1MB.
[env:nodemcuv2]
extends = common
board = nodemcuv2
board_build.filesystem = littlefs
board_build.partitions = partitions.csv

; ---------------------------------------------------------------- Simulasi
; Wokwi tidak butuh board fisik; dipakai untuk uji logika tanpa hardware.
[env:wokwi]
extends = common
board = esp01_1m
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
build_flags =
    ${common.build_flags}
    -D WOKWI_SIMULATION=1